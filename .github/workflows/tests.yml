name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package under test
        run: python -m pip install --disable-pip-version-check .
      - name: Check desktop app syntax
        run: python -m py_compile md2pdf_app.py
      - name: Run regression tests
        run: |
          if command -v xvfb-run > /dev/null 2>&1; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi

  package-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build
      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel
      - name: Verify bundled renderer templates
        run: python -c "from pathlib import Path; import tarfile, zipfile; wheels=list(Path('dist').glob('*.whl')); sdists=list(Path('dist').glob('*.tar.gz')); assert len(wheels)==1 and len(sdists)==1; names=set(zipfile.ZipFile(wheels[0]).namelist()); assert any(n.endswith('/templates/styled.latex') for n in names); assert any(n.endswith('/templates/callout-boxes.lua') for n in names); tnames=set(tarfile.open(sdists[0]).getnames()); assert any(n.endswith('/templates/styled.latex') for n in tnames); assert any(n.endswith('/templates/callout-boxes.lua') for n in tnames)"
      - name: Install wheel and smoke-test CLI
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall dist/*.whl
          cd /tmp
          md2pdf --version
          md2pdf --help
          python -m md2pdf.cli --version

  renderer-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native renderer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package under test
        run: python -m pip install --disable-pip-version-check .
      - name: Run real renderer integration test
        run: python -m unittest tests.test_renderer_integration -v

  sidebar-integration:
    runs-on: ubuntu-latest
    env:
      MD2PDF_SIDEBAR_INTEGRATION: "1"
      MD2PDF_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install native Sidebar toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc chromium
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package under test
        run: python -m pip install --disable-pip-version-check .
      - name: Provision exact browser assets
        env:
          MD2PDF_ASSET_DIR: ${{ runner.temp }}/md2pdf-web-assets
          MD2PDF_OFFLINE: "0"
        run: python -m md2pdf.web_assets --asset-dir "$MD2PDF_ASSET_DIR"
      - name: Run real Sidebar integration test offline
        env:
          MD2PDF_ASSET_DIR: ${{ runner.temp }}/md2pdf-web-assets
          MD2PDF_OFFLINE: "1"
        run: python -m unittest tests.test_sidebar_integration -v


  corpus-validation:
    runs-on: ubuntu-latest
    needs: [unit-tests, package-validation, renderer-integration, sidebar-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package under test
        run: python -m pip install --disable-pip-version-check .
      - name: Validate release corpus contract
        run: python -m unittest tests.test_release_corpus -v
