name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build
      - name: Run standard-library regression tests
        run: python -m unittest discover -s tests -v
      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel
      - name: Verify wheel metadata and bundled renderer assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert any(name.endswith("/templates/styled.latex") for name in names), "styled.latex missing"
          assert any(name.endswith("/templates/callout-boxes.lua") for name in names), "callout-boxes.lua missing"
          print(f"Verified package: {wheel.name}")
          PY
      - name: Install wheel and smoke-test CLI
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
          mkdir -p /tmp/md2pdf-package-smoke
          cd /tmp/md2pdf-package-smoke
          md2pdf --help
          python -m md2pdf.cli --help

  renderer-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native renderer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real renderer integration test
        run: python -m unittest tests.test_renderer_integration -v
