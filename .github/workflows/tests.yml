name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library regression tests
        run: python -m unittest discover -s tests -v

  package-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build
      - name: Build source distribution and wheel
        run: python -m build --sdist --wheel
      - name: Verify bundled renderer templates
        run: python -c "from pathlib import Path; import zipfile; wheels=list(Path('dist').glob('*.whl')); assert len(wheels)==1, wheels; names=set(zipfile.ZipFile(wheels[0]).namelist()); assert any(n.endswith('/templates/styled.latex') for n in names); assert any(n.endswith('/templates/callout-boxes.lua') for n in names)"
      - name: Install wheel and smoke-test CLI
        run: |
          python -m pip install --disable-pip-version-check --force-reinstall --no-deps dist/*.whl
          cd /tmp
          md2pdf --help
          python -m md2pdf.cli --help

  renderer-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native renderer toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc wkhtmltopdf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run real renderer integration test
        run: python -m unittest tests.test_renderer_integration -v

  sidebar-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Sidebar CI job starts
        run: python -c "print(\"Sidebar CI job starts\")"
