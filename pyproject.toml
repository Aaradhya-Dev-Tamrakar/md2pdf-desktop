[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf-desktop"
version = "0.3.0"
description = "Release-quality technical Markdown-to-PDF conversion with desktop, CLI, and MCP interfaces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf==6.19.0"]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[tool.setuptools]
packages = ["md2pdf"]
include-package-data = true

[tool.setuptools.package-data]
md2pdf = ["templates/*.latex", "templates/*.lua"]

[project.urls]
Homepage = "https://github.com/Aaradhya-Dev-Tamrakar/md2pdf-desktop"
Repository = "https://github.com/Aaradhya-Dev-Tamrakar/md2pdf-desktop"
Issues = "https://github.com/Aaradhya-Dev-Tamrakar/md2pdf-desktop/issues"
